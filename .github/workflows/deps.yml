name: Add npm packages

# Push a branch named deps/* with the packages listed (space-separated) in
# .github/deps-add.txt. This installs them and commits the updated
# package.json + package-lock.json back to that branch.
on:
  push:
    branches: ['deps/**']
    paths: ['.github/deps-add.txt']

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund $(cat .github/deps-add.txt)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm -q .github/deps-add.txt
          git commit -m "Add $(git show HEAD:.github/deps-add.txt)" || echo "nothing to commit"
          git push
