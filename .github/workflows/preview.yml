name: Preview build + screenshots

# Push any branch named preview/* to typecheck, build and capture
# screenshots of every page (desktop + phone, light + dark) without deploying.
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 http://localhost:4173 -t 60000
          THUMBS=1 node scripts/shoot.mjs
      # Gallery thumbnails are re-rendered from the built pages; keep them.
      - name: Commit refreshed thumbnails
        run: |
          git add public/samples/thumbs public/home public/og-image.jpg
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh gallery thumbnails"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      # Screenshots go to a throwaway orphan branch so they can be fetched with git.
      - name: Publish screenshots
        if: always()
        run: |
          cd shots
          git init -q -b shots
          git add -A
          git -c user.name=preview -c user.email=preview@users.noreply.github.com commit -qm "shots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" shots:refs/heads/shots
