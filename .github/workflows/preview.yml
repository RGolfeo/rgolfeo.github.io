name: Preview build + screenshots

# Push any branch named preview/* to typecheck, build and capture
# screenshots of every page (desktop + phone, light + dark) without deploying.
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 http://localhost:4173 -t 60000
          node scripts/shoot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          retention-days: 3
